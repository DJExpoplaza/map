        { text: { ko: "1주차장", en: "Parking Lot 1", ja: "第1駐車場", zh: "第1停车场" }, x: 61.3636, y: 88.4836, bgColor: "rgba(40, 167, 69, 0.8)", size: 1.5 },
        { text: { ko: "2주차장", en: "Parking Lot 2", ja: "第2駐車場", zh: "第2停车场" }, x: 35.3799, y: 90.4836, bgColor: "rgba(40, 167, 69, 0.8)", size: 1.5 },
        { text: { ko: "1게이트", en: "Gate 1", ja: "ゲート1", zh: "1号门" }, x: 70.7938, y: 95.0330, bgColor: "rgba(220, 53, 69, 0.8)", size: 1.1 },
        { text: { ko: "2게이트", en: "Gate 2", ja: "ゲート2", zh: "2号门" }, x: 52.9512, y: 95.0330, bgColor: "rgba(220, 53, 69, 0.8)", size: 1.1 },
        { text: { ko: "3게이트", en: "Gate 3", ja: "ゲート3", zh: "3号门" }, x: 45.6242, y: 95.0330, bgColor: "rgba(220, 53, 69, 0.8)", size: 1.1 },
        { text: { ko: "4게이트", en: "Gate 4", ja: "ゲート4", zh: "4号门" }, x: 27.1031, y: 95.0330, bgColor: "rgba(220, 53, 69, 0.8)", size: 1.1 },
        { text: { ko: "5게이트", en: "Gate 5", ja: "ゲート5", zh: "5号门" }, x: 3.2904, y: 95.0330,  bgColor: "rgba(220, 53, 69, 0.8)", size: 1.1 },                    
        { text: { ko: "배달<br>픽업존1", en: "Pickup<br>Zone 1", ja: "受取<br>ゾーン1", zh: "取餐区1" }, x: 45.5493 , y: 87.0211,  bgColor: "rgba(128, 0, 128, 0.8)", size: 0.6 },
        { text: { ko: "배달<br>픽업존3", en: "Pickup<br>Zone 3", ja: "受取<br>ゾーン3", zh: "取餐区3" }, x: 52.0212 , y: 87.0211,  bgColor: "rgba(128, 0, 128, 0.8)", size: 0.6 },
        { text: { ko: "배달<br>픽업존2", en: "Pickup<br>Zone 2", ja: "受取<br>ゾーン2", zh: "取餐区2" }, x: 43.6481 , y: 59.7474,  bgColor: "rgba(128, 0, 128, 0.8)", size: 0.6 }
    ];

    placeMarkers.forEach(label => {
        const pinIcon = document.createElement('div');
        pinIcon.className = 'place-pin-icon';
        pinIcon.style.left = label.x + '%';
        pinIcon.style.top = label.y + '%';
        const pColor = label.pinColor || "#000000";
        pinIcon.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="${pColor}" stroke="white" stroke-width="1.5"/><circle cx="12" cy="9.2" r="3.5" fill="#ffffff"/></svg>`;
        wrapper.appendChild(pinIcon);

        const labelDiv = document.createElement('div');
        labelDiv.className = 'map-label';
        labelDiv.innerHTML = label.text.ko;
        labelDiv.style.backgroundColor = label.bgColor || "rgba(0,0,0,0.4)";
        labelDiv.style.setProperty('--label-size', (label.size || 1.6) + unit);
        labelDiv.style.left = (label.x + (label.textOffsetX || 0)) + '%';
        labelDiv.style.top = (label.y + (label.textOffsetY || 0)) + '%';
        wrapper.appendChild(labelDiv);
        
        label.element = labelDiv; 
    });

    textOnlyMarkers.forEach(label => {
        const labelDiv = document.createElement('div');
        labelDiv.className = 'map-label';
        labelDiv.innerHTML = label.text.ko; 
        labelDiv.style.backgroundColor = label.bgColor || "rgba(0,0,0,0.4)";
        labelDiv.style.setProperty('--label-size', (label.size || 1.6) + unit);
        labelDiv.style.left = label.x + '%';
        labelDiv.style.top = label.y + '%';
        wrapper.appendChild(labelDiv);

        label.element = labelDiv;
    });

    // 언어 변경 로직
    window.changeLanguage = function(lang) {
        if (typeof gtag === 'function') {
            gtag('event', 'language_select', { 'selected_language': lang });
        }

        placeMarkers.forEach(label => {
            if (label.element && label.text[lang]) { label.element.innerHTML = label.text[lang]; }
        });
        textOnlyMarkers.forEach(label => {
            if (label.element && label.text[lang]) { label.element.innerHTML = label.text[lang]; }
        });

        // 팝업이 켜져있을 경우 팝업 텍스트도 변경
        const introText = document.getElementById('intro-text');
        if (introText && popupTexts[lang]) {
            introText.innerHTML = popupTexts[lang];
        }

        const langNames = { ko: '한국어', en: 'English', ja: '日本語', zh: '中國語' };
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText === langNames[lang]) { btn.classList.add('active'); }
        });
    };

    const pin = document.getElementById('user-pin');
    const toast = document.getElementById('toast');
    let lastLat = null; let lastLng = null;

    // 조감도 삼각측량 로직 
    const pts = [
        { lat: 36.370962, lng: 127.382746, x: 2.6834,  y: 1.8741  },
        { lat: 36.370470, lng: 127.393335, x: 96.0066,  y: 9.6069 },
        { lat: 36.365067, lng: 127.393368, x: 96.9010,  y: 95.0972  },
        { lat: 36.365093, lng: 127.382920, x: 3.8760,   y: 94.2380 }
    ];

    const triangles = [[0, 1, 3], [1, 2, 3]];

    function getWeights(p, a, b, c) {
        const det = (b.lat - c.lat) * (a.lng - c.lng) + (c.lng - b.lng) * (a.lat - c.lat);
        if(det === 0) return null;
        const w1 = ((b.lat - c.lat) * (p.lng - c.lng) + (c.lng - b.lng) * (p.lat - c.lat)) / det;
        const w2 = ((c.lat - a.lat) * (p.lng - c.lng) + (a.lng - c.lng) * (p.lat - c.lat)) / det;
        return {w1, w2, w3: 1 - w1 - w2};
    }

    function calculateMapPosition(currentLat, currentLng) {
        const p = { lat: currentLat, lng: currentLng };
        let bestWeights = null; let bestTriangle = null; let maxMinWeight = -Infinity;
        for (let i = 0; i < triangles.length; i++) {
            const A = pts[triangles[i][0]], B = pts[triangles[i][1]], C = pts[triangles[i][2]];
            const w = getWeights(p, A, B, C); if(!w) continue;
            const minW = Math.min(w.w1, w.w2, w.w3);
            if (minW >= -0.05) { bestTriangle = triangles[i]; bestWeights = w; break; }
            if (minW > maxMinWeight) { maxMinWeight = minW; bestTriangle = triangles[i]; bestWeights = w; }
        }
        if (!bestTriangle) return null;
        const A = pts[bestTriangle[0]], B = pts[bestTriangle[1]], C = pts[bestTriangle[2]];
        
        const fixedOffsetX = 0.2, fixedOffsetY = -0.1;
        let fx = (bestWeights.w1 * A.x + bestWeights.w2 * B.x + bestWeights.w3 * C.x) + fixedOffsetX;
        let fy = (bestWeights.w1 * A.y + bestWeights.w2 * B.y + bestWeights.w3 * C.y) + fixedOffsetY;
        return { x: Math.max(0, Math.min(100, fx)), y: Math.max(0, Math.min(100, fy)) };
    }

    function updatePin() {
        if (!lastLat || !lastLng) return;
        const pos = calculateMapPosition(lastLat, lastLng);
        if (pos) {
            pin.style.left = pos.x + '%'; pin.style.top = pos.y + '%';
            pin.style.display = 'block';
            toast.style.opacity = '0'; setTimeout(() => toast.style.display = 'none', 500);
        }
    }

    // 모바일 기기인지 판별 (데스크톱에서는 위치 추적 안 함)
    const isMobileDevice = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);

    if (!isMobileDevice) {
        // 데스크톱: 처음부터 안내 토스트 숨김
        toast.style.display = 'none';
    } else {
        // 모바일/태블릿: 위치 추적 실행
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                p => { 
                    lastLat = p.coords.latitude; 
                    lastLng = p.coords.longitude; 
                    updatePin(); 
                },
                e => { 
                    if (e.code === 1) {
                        toast.innerText = "⚠️ 위치 권한이 차단되어 일반 안내도로 동작합니다.";
                        toast.style.background = "rgba(220, 53, 69, 0.9)";
                        toast.style.opacity = '1';
                        toast.style.display = 'block';
                        
                        // 3초 후 경고창 자동 숨김
                        setTimeout(() => {
                            toast.style.opacity = '0'; 
                            setTimeout(() => toast.style.display = 'none', 500);
                        }, 3000);
                        
                    } else if (e.code === 3) {
                        toast.innerText = "📡 신호가 약합니다. 잠시 대기 중...";
                    }
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }
    }
})();
</script>
